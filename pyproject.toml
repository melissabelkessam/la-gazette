[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "la-gazette"
version = "0.1.0"
description = "Pipeline qui lit la presse chaque matin et publie l'édition de 7 h"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.setuptools.package-data]
gazette = ["migrations/*.sql"]