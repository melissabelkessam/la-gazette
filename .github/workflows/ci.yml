# CI de La gazette : lint -> tests -> build de l'image -> push sur ghcr.io
# - Sur une pull request : lint, tests et build (sans push). Si c'est rouge, le merge est bloqué.
# - Sur un push sur main : la même chose, puis push de l'image taguée AAAAMMJJHHMMSS-sha.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-et-tests:
    runs-on: ubuntu-latest
    # Une vraie base PostgreSQL pour les tests de migrations et de la table sources
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gazette_test
          POSTGRES_USER: gazette
          POSTGRES_PASSWORD: gazette_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gazette -d gazette_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GAZETTE_TEST_DATABASE_URL: postgresql://gazette:gazette_test@localhost:5432/gazette_test
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest

  image:
    needs: lint-et-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Calculer le nom et le tag de l'image
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire (et pousser si on est sur main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Afficher le tag publié
        if: github.event_name == 'push'
        run: |
          echo "Image publiée : ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
